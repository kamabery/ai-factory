<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory board</title>
<script src="/vendor/marked.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f5; --text: #1b1f24; --muted: #5d6673;
    --border: #d9dde3; --accent: #3b5bdb; --accent-soft: #e5ebff; --ok: #2b8a3e; --ok-soft: #e3f5e7;
    --warn: #c92a2a; --warn-soft: #fde8e8; --run: #e8590c; --run-soft: #fff0e3; --shadow: 0 1px 2px rgba(0,0,0,.08);
    --radius: 8px; --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
    --term-bg: #14171c; --term-text: #d6dbe2; --term-muted: #7d8794; --term-tool: #8fb3ff; --term-tag: #f5a97f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111418; --panel: #1a1e24; --panel-2: #222730; --text: #e6e9ee; --muted: #9aa3ae;
      --border: #2e343d; --accent: #7b93ff; --accent-soft: #232c4a; --ok: #69db7c; --ok-soft: #1c3324;
      --warn: #ff8787; --warn-soft: #3d1f22; --run: #ffa94d; --run-soft: #3a2a19; --shadow: 0 1px 2px rgba(0,0,0,.4);
      --term-bg: #0b0d10;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111418; --panel: #1a1e24; --panel-2: #222730; --text: #e6e9ee; --muted: #9aa3ae;
    --border: #2e343d; --accent: #7b93ff; --accent-soft: #232c4a; --ok: #69db7c; --ok-soft: #1c3324;
    --warn: #ff8787; --warn-soft: #3d1f22; --run: #ffa94d; --run-soft: #3a2a19; --shadow: 0 1px 2px rgba(0,0,0,.4);
    --term-bg: #0b0d10;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 6px 8px 0 0; white-space: nowrap; }
  #views { display: flex; gap: 2px; margin-top: 2px; }
  #views button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 4px 10px; color: var(--muted); }
  #views button.on { color: var(--text); border-bottom-color: var(--accent); }
  #evals { display: grid; grid-template-columns: minmax(320px, 2fr) 3fr; gap: 12px; padding: 16px; align-items: start; }
  #lessons { display: grid; grid-template-columns: minmax(320px, 2fr) 3fr; gap: 12px; padding: 16px; align-items: start; }
  #pipeline[hidden], #board[hidden], #evals[hidden], #lessons[hidden] { display: none; }
  .chip.preview { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
  .chip.preview.down, .chip.preview.expired { color: var(--muted); background: transparent; border-color: var(--border); }
  .chip.preview.failed { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
  .chip.action { cursor: pointer; text-decoration: none; color: var(--text); background: var(--panel); }
  .lesson-actions { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
  .lesson-row .top input { margin-right: 6px; }
  .eval-list { display: flex; flex-direction: column; gap: 8px; }
  .eval-row.card .meta span { white-space: nowrap; }
  .chip.rating-good { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
  .chip.rating-mixed { color: var(--run); background: var(--run-soft); border-color: transparent; }
  .chip.rating-poor { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
  .eval-body { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 16px; min-height: 200px; }
  .eval-empty { color: var(--muted); padding: 12px 0; }
  .feedback { margin: 16px 0 12px; padding-top: 14px; border-top: 1px solid var(--border); }
  .feedback h2 { margin: 0 0 10px; font-size: 16px; }
  .feedback .ratings { display: flex; gap: 6px; margin-bottom: 8px; }
  .feedback .ratings button.on { color: var(--text); border-color: var(--accent); }
  .feedback textarea { font-family: inherit; }
  .facts { margin: 12px 0 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .facts h2 { margin: 0 0 10px; font-size: 16px; }
  .fact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
  .fact { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; min-width: 0; }
  .fact .k { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .fact .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .fact .v.green { color: var(--ok); } .fact .v.red { color: var(--warn); }
  .fact .s { font-size: 11.5px; color: var(--muted); }
  .breakdown { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
  .breakdown h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .bd-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; font-size: 12.5px; padding: 3px 0; }
  .bd-row .name { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bd-row .num { font-variant-numeric: tabular-nums; text-align: right; }
  .bd-row .bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--accent); opacity: .7; }
  #idea-hint { flex: 1; margin-top: 7px; color: var(--muted); font-size: 12.5px; }
  #purge-btn { font-size: 11px; text-transform: none; letter-spacing: 0; padding: 1px 8px; margin-left: 8px; }
  .chip.kind { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
  .chip.provider[data-toggle] { cursor: pointer; }
  .chip.provider.openrouter { color: var(--run); background: var(--run-soft); border-color: transparent; }
  input, textarea { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
  textarea { width: 100%; font-family: var(--mono); font-size: 12.5px; }
  a.button { text-decoration: none; display: inline-block; }
  .chip.pr { color: var(--accent); background: var(--accent-soft); border-color: transparent; text-decoration: none; }
  button, a.button { font: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); border-radius: 6px; padding: 6px 12px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--warn); }
  button:disabled { opacity: .5; cursor: default; }
  .spinner { display: inline-block; width: 1em; height: 1em; margin-right: 5px; vertical-align: -.15em; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #pipeline { display: flex; align-items: center; gap: 6px; padding: 10px 16px; overflow-x: auto; border-bottom: 1px solid var(--border); background: var(--panel); }
  .node { position: relative; border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; white-space: nowrap; background: var(--panel-2); color: var(--muted); }
  .node.active { color: var(--run); border-color: var(--run); background: var(--run-soft); animation: pulse 1.2s ease-in-out infinite; }
  .node .badges { display: inline-flex; gap: 3px; margin-left: 6px; }
  .node .badge { font-size: 11px; font-family: var(--mono); background: var(--run); color: #fff; border-radius: 4px; padding: 0 4px; }
  .arrow { color: var(--muted); }
  .group { display: inline-flex; gap: 4px; padding: 3px; border: 1px dashed var(--border); border-radius: 999px; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 4px var(--run-soft); } }

  #board { display: grid; grid-template-columns: repeat(6, minmax(200px, 1fr)); gap: 12px; padding: 16px; overflow-x: auto; align-items: start; }
  .column { background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--radius); min-height: 200px; display: flex; flex-direction: column; }
  .column h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0; padding: 10px 12px; display: flex; justify-content: space-between; }
  .column .cards { display: flex; flex-direction: column; gap: 8px; padding: 0 8px 8px; min-height: 120px; flex: 1; }
  .column.drop-ok { outline: 2px dashed var(--accent); outline-offset: -2px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; box-shadow: var(--shadow); cursor: pointer; }
  .card[draggable="true"] { cursor: grab; }
  .card.selected { border-color: var(--accent); }
  .card .top { display: flex; justify-content: space-between; gap: 6px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .card .title { font-weight: 600; margin: 3px 0 5px; }
  .card .meta { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 11.5px; color: var(--muted); }
  .card .repo { font-family: var(--mono); font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip { font-size: 11px; font-family: var(--mono); padding: 0 5px; border-radius: 4px; border: 1px solid var(--border); }
  .chip.PASS { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
  .chip.CHANGES { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
  .chip.running { color: var(--run); background: var(--run-soft); border-color: transparent; }
  .flag { font-size: 11px; font-weight: 600; color: #fff; background: var(--warn); border-radius: 4px; padding: 0 6px; }
  .sub { font-size: 11px; color: var(--run); background: var(--run-soft); border-radius: 4px; padding: 0 5px; }
  .idea-card .title { font-weight: 500; }
  .idea-card.failed { border-color: var(--warn); }

  #backdrop { position: fixed; inset: 0; background: rgba(10,12,16,.45); display: none; align-items: center; justify-content: center; z-index: 10; padding: 2.5vh 2.5vw; }
  #backdrop.open { display: flex; }
  #modal { width: min(1200px, 95vw); height: 90vh; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,.3); display: flex; flex-direction: column; overflow: hidden; }
  #m-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); }
  #m-head h3 { margin: 0 0 4px; font-size: 18px; padding-right: 40px; }
  #m-head .close { float: right; }
  #m-head .sub-meta { color: var(--muted); font-size: 12.5px; }
  #m-head .sub-meta code { font-family: var(--mono); font-size: 12px; }
  .flagbox { background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 8px 10px; margin-top: 8px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
  .merged { margin-top: 8px; background: var(--ok-soft); border-radius: 6px; padding: 8px 10px; font-size: 12.5px; }
  .merged ul { margin: 4px 0 0; padding-left: 18px; font-family: var(--mono); font-size: 12px; max-height: 18vh; overflow: auto; }
  .merged .kind { color: var(--muted); }
  .rework { margin-top: 8px; }
  #m-tabs { display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
  #m-tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 12px; color: var(--muted); }
  #m-tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  #m-body { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; height: 100%; min-height: 0; }
  .split > * { min-height: 0; }
  .editor-col { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  #spec-editor { flex: 1; resize: none; min-height: 200px; }
  #spec-preview { overflow: auto; border: 1px solid var(--border); border-radius: 6px; padding: 4px 14px; }
  .files-col { display: flex; flex-direction: column; gap: 2px; overflow: auto; }
  .files-col a { font-family: var(--mono); font-size: 12px; color: var(--accent); padding: 3px 6px; border-radius: 4px; text-decoration: none; }
  .files-col a.on { background: var(--accent-soft); }
  .art { display: grid; grid-template-columns: 220px 1fr; gap: 12px; height: 100%; min-height: 0; }
  #viewer { overflow: auto; min-height: 0; }
  .md { font-size: 14px; line-height: 1.5; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 16px; margin-top: 18px; } .md h3 { font-size: 14px; }
  .md code { font-family: var(--mono); font-size: 12.5px; background: var(--panel-2); padding: 0 3px; border-radius: 3px; }
  .md pre code { background: none; padding: 0; }
  .md ul { padding-left: 22px; } .md li { margin: 2px 0; }
  .md input[type="checkbox"] { margin-right: 6px; }
  pre { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 12.5px; overflow: auto; margin: 0; }
  [data-timeline] { list-style: none; padding: 0; margin: 0; font-size: 12.5px; }
  [data-timeline] li { display: grid; grid-template-columns: 80px 1fr; gap: 8px; padding: 3px 0; border-bottom: 1px dotted var(--border); }
  [data-timeline] time { font-family: var(--mono); color: var(--muted); }

  .term { background: var(--term-bg); color: var(--term-text); font-family: var(--mono); font-size: 12px; line-height: 1.45; border-radius: 6px; padding: 10px 12px; height: 100%; overflow: auto; white-space: pre-wrap; word-break: break-word; }
  .term .ln { padding: 1px 0; }
  .term .tag { color: var(--term-tag); margin-right: 6px; }
  .term .tool { color: var(--term-tool); }
  .term .res, .term .dim { color: var(--term-muted); }
  .term .thinking { color: var(--term-muted); font-style: italic; }
  .term .sep { color: var(--term-muted); margin: 8px 0 4px; border-top: 1px dashed #333a44; padding-top: 6px; }
  .term .done { color: #69db7c; }

  #new-idea-btn { font-size: 11px; text-transform: none; letter-spacing: 0; padding: 1px 8px; margin-left: 8px; }
  .session-card { border-left: 3px solid var(--accent); }
  .sess { display: flex; flex-direction: column; gap: 10px; height: 100%; min-height: 0; }
  .s-log { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
  .s-act { border-top: 1px solid var(--border); padding-top: 10px; max-height: 60%; overflow: auto; }
  .msg { border-radius: 8px; padding: 8px 12px; max-width: 85%; }
  .msg.you { align-self: flex-end; background: var(--accent-soft); white-space: pre-wrap; }
  .msg.claude { align-self: flex-start; background: var(--panel-2); }
  .msg.claude.live::after { content: ' ▍'; color: var(--accent); animation: pulse 1s infinite; }
  .msg p:first-child { margin-top: 0; } .msg p:last-child { margin-bottom: 0; }
  .tool-ln { align-self: flex-start; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .q { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .q .qh { display: flex; gap: 8px; align-items: baseline; margin-bottom: 6px; }
  .q .opts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .q .opt { text-align: left; max-width: 280px; }
  .q .opt small { display: block; color: var(--muted); font-size: 11.5px; }
  .q .opt.on { border-color: var(--accent); background: var(--accent-soft); }
  .q input[type="text"], .s-form input, .s-form select { width: 100%; }
  .s-form { display: grid; grid-template-columns: 140px 1fr; gap: 8px 12px; align-items: center; max-width: 640px; }
  .s-form select { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
  .s-brief { border: 1px solid var(--border); border-radius: 8px; padding: 4px 14px; margin-bottom: 8px; }
  .spec-card { border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; }
  .spec-card.decided { opacity: .75; }
  .spec-card summary { cursor: pointer; font-weight: 600; }
  .spec-card .spec-edit { min-height: 260px; }
  .working { color: var(--run); }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 6px; max-width: min(90vw, 640px); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
  #toast.show { opacity: 1; }
  #toast.error { background: var(--warn); color: #fff; }
  #canary { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 8px 16px; font-size: 13px; background: var(--warn-soft); color: var(--warn); border-bottom: 1px solid var(--border); }
  #canary[hidden] { display: none; }
  #canary.running { background: var(--run-soft); color: var(--run); }
  #canary .why { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  #canary code { font-size: 12px; }
  @media (max-width: 700px) {
    #board { grid-template-columns: repeat(6, 78vw); }
    .split, .art, #evals, #lessons, .breakdown { grid-template-columns: 1fr; height: auto; }
    #modal { height: 95vh; }
  }
</style>
</head>
<body>
<header>
  <h1>Factory</h1>
  <nav id="views" aria-label="Views"><button type="button" data-view="board" class="on">Board</button><button type="button" data-view="evals">Evaluations</button><button type="button" data-view="lessons">Lessons</button></nav>
  <span id="idea-hint">New idea: <code>pwsh factory/scripts/idea.ps1 &lt;owner/name&gt;</code> opens a Claude session that grills you, writes the specs and puts the ones you approve on the board.</span>
  <button id="theme" type="button" title="Toggle theme">◐</button>
</header>

<div id="canary" role="status" hidden></div>
<nav id="pipeline" aria-label="Pipeline"></nav>
<main id="board"></main>
<main id="evals" hidden><div class="eval-list"></div><div class="eval-body md" data-eval-body></div></main>
<main id="lessons" hidden><div class="eval-list"></div><div class="eval-body md" data-lesson-body></div></main>
<div id="backdrop"><section id="modal" role="dialog" aria-modal="true" aria-label="Details">
  <div id="m-head"></div><nav id="m-tabs"></nav><div id="m-body"></div>
</section></div>
<div id="toast" role="status"></div>

<script>
const COLUMNS = [
  { key: 'ideas', label: 'Ideas' },
  { key: 'backlog', label: 'Backlog', stages: ['backlog'] },
  { key: 'approved', label: 'Approved', stages: ['approved'] },
  { key: 'building', label: 'Building', stages: ['build', 'review', 'deploy', 'approve', 'gate', 'blocked'] },
  { key: 'ready', label: 'Ready for review', stages: ['ready'] },
  { key: 'done', label: 'Done', stages: ['done'] },
];
const DROP_TARGETS = { backlog: ['approved', 'done'], ready: ['approved', 'done'] };
const ROLES = ['security', 'code', 'ux', 'ui'];
const NODES = ['spec-writer', 'builder', ['security-reviewer', 'code-reviewer', 'ux-reviewer', 'ui-reviewer'], 'devops', 'approver', 'gate'];
const BUILDING = ['build', 'review', 'deploy', 'approve', 'gate'];   // blocked waits in Building but is not building
// A job blocked from deploy can retry it; one blocked from build or review never had a passing round.
const blockedFromDeploy = (j) => j.stage === 'blocked' && (j.history ?? []).at(-1)?.from === 'deploy';

const state = {
  board: { jobs: [], ideas: [] }, events: [], boardText: '', eventsText: '',
  config: { enabled: false }, sessions: [], sessionsText: '',
  sess: null,            // the open idea session: { id, s, chat, streamText, texts, actKey }
  open: null,            // { kind: 'job' | 'idea' | 'session' | 'new-session', id }
  tab: 'spec', files: [], specText: null, specDirty: false, viewerFile: null, viewerText: null, outputKey: '',
  moving: new Set(),     // job ids with a move to Approved in flight; kept here because a poll re-renders the buttons
};
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// --- markdown (raw HTML in agent output is shown as text, never rendered) ------------------------
// A backslash is kept literally (no markdown escapes), so Windows paths such as D:\code\.x render as typed.
const literalBackslash = {
  name: 'literalBackslash', level: 'inline',
  start: (src) => src.indexOf('\\'),
  tokenizer: (src) => src[0] === '\\' ? { type: 'text', raw: '\\', text: '\\' } : undefined,
};
if (window.marked) marked.use({ gfm: true, extensions: [literalBackslash], renderer: { html: (token) => esc(typeof token === 'string' ? token : token.text) } });
// What each flag reason means for the human, shown above the flag's own detail in the job modal.
const FLAG_MEANS = {
  escalated: 'the factory stopped short of the gate and needs your decision before this goes further.',
  'max-rounds': 'reviewers still asked for changes after the last build round.',
  'gate-failed': 'a gate command exited non-zero; gate.log has the output.',
  'merge-blocked': 'the merge was refused.',
  environment: 'the devops agent judged the environment or the factory at fault, which cannot be fixed by an agent. Fix the cause, then Retry deploy.',
  'deploy-fix-rounds': 'two deploy-fix rounds did not get the change deployed; the diagnosis is below. Rework it, or discard it.',
  'deploy-failed': 'the preview did not deploy in five attempts; deploy-<n>.log has the GitHub and HCP logs, and the preview is left up for you to look at.',
  'out-of-scope': 'the build changed the paths below, which match none of the Scope: In globs in the spec, so it stopped before review. Rework with a line "Scope +: <glob>, <glob>" to keep them (the spec is widened), or with a note asking the builder to remove them.',

// --- data ----------------------------------------------------------------------------------
async function getText(url) {

}
// The deploy canary (see "Canary" in the contract): a banner while one runs, or after one failed,
// because deployable jobs wait in Approved until it passes. Returns whether canary.json changed.
function renderCanary(text) {
  const el = $('#canary');
  let c = null; try { c = text ? JSON.parse(text) : null; } catch { c = null; }
  if (text === state.canaryText) return false;
  state.canaryText = text;
  state.canary = c;
  const stuck = c?.status === 'pass' && c.teardown?.status === 'failed';
  if (!c || (c.status !== 'failed' && c.status !== 'running' && !stuck)) { el.hidden = true; el.innerHTML = ''; return true; }
  el.hidden = false;
  el.className = c.status === 'running' ? 'running' : '';
  el.innerHTML = c.status === 'running'
    ? `<span class="why">Deploy canary running (since ${esc(new Date(c.startedAt).toLocaleTimeString())}): deployable jobs wait for it.</span>`
    : stuck
    ? `<span class="why"><strong>The deploy canary passed, but j000 could not be torn down</strong> (${esc(c.teardown.failures)} of 5 tries). <code>${esc(c.teardown.error)}</code></span>
       <a data-canary-log href="/state/${esc(c.log)}" target="_blank" rel="noopener">Log</a>`
    : `<span class="why"><strong>Deployable jobs are waiting:</strong> the deploy canary failed. <code>${esc(c.error)}</code></span>
       <a data-canary-log href="/state/${esc(c.log)}" target="_blank" rel="noopener">Log</a>
       <button type="button" data-run-canary>Run canary</button>`;
  $('[data-run-canary]', el)?.addEventListener('click', async (e) => {
    e.currentTarget.disabled = true;
    const r = await api('POST', '/api/canary', {});
    toast(r.message, !r.ok);
  });
  return true;
}

async function poll() {
  try {
    const canaryChanged = renderCanary(await getText('/state/canary.json'));
    const [b, e, ss] = await Promise.all([getText('/state/board.json'), getText('/state/events.jsonl'), state.config.enabled ? getText('/api/sessions') : '']);
    if (state.open?.kind === 'session') refreshSession();
    if (b === state.boardText && e === state.eventsText && ss === state.sessionsText) {
      if (canaryChanged && !dragging) renderBoard();   // Approved cards wait on the canary
      if (state.open && state.tab === 'output') refreshOutput();
      return;
    }
    state.boardText = b; state.eventsText = e; state.sessionsText = ss;
    try { state.sessions = ss ? JSON.parse(ss) : []; } catch { state.sessions = []; }
    state.board = b ? JSON.parse(b) : { jobs: [], ideas: [] };
    state.board.jobs ??= []; state.board.ideas ??= [];
    state.events = e.split('\n').filter(Boolean).map((l) => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean);
    render();
    if (state.open?.kind === 'session') { renderHead(); return; }
    if (state.open?.kind === 'new-session') return;
    if (state.open) { renderHead(); refreshFiles(); if (state.tab === 'timeline') renderBody(); if (state.tab === 'output') refreshOutput(); }
  } catch (err) { console.warn('poll failed', err); }
}
async function api(method, url, body, type = 'application/json') {
  const r = await fetch(url, { method, headers: { 'Content-Type': type }, body: type === 'application/json' ? JSON.stringify(body) : body });
  let res; try { res = await r.json(); } catch { res = { ok: false, message: `HTTP ${r.status}` }; }
  return res;
}

let toastTimer;

// --- pipeline ------------------------------------------------------------------------------
function activeAgents() {
  const running = new Map();
  for (const ev of state.events) {
    if (ev.kind !== 'agent-start' && ev.kind !== 'agent-stop') continue;
    const key = `${ev.job ?? ev.idea}|${ev.agent}`;
    if (ev.kind === 'agent-start') running.set(key, { id: ev.job ?? ev.idea, agent: ev.agent });
    else running.delete(key);
  }
  // An escalated or killed run never logs agent-stop, so a job's agents count only while it is on the
  // board and building (a purged job is gone from the board but not from the events).
  const stage = new Map(state.board.jobs.map((j) => [j.id, j.stage]));
  const byAgent = {};
  for (const { id, agent } of running.values()) {
    if (/^J-/.test(id) && !BUILDING.includes(stage.get(id))) continue;
    (byAgent[agent] ??= new Set()).add(id);
  }
  for (const j of state.board.jobs) if (j.stage === 'gate') (byAgent.gate ??= new Set()).add(j.id);
  return byAgent;
}
function renderPipeline() {
  const active = activeAgents();
  const node = (n) => {
    const ids = [...(active[n] ?? [])];
    return `<span class="node${ids.length ? ' active' : ''}" data-node="${n}">${esc(n)}${ids.length ? `<span class="badges">${ids.map((i) => `<span class="badge">${esc(i)}</span>`).join('')}</span>` : ''}</span>`;
  };
  $('#pipeline').innerHTML = NODES.map((n) => Array.isArray(n) ? `<span class="group">${n.map(node).join('')}</span>` : node(n)).join('<span class="arrow">→</span>');
}

// --- board ---------------------------------------------------------------------------------
function elapsed(j) {
  const start = Date.parse(j.approvedAt ?? j.createdAt);
  const end = ['done', 'discarded', 'ready', 'blocked', 'backlog'].includes(j.stage) ? Date.parse(j.updatedAt) : Date.now();
  if (!start || !end) return '';
  const s = Math.max(0, Math.round((end - start) / 1000));
  return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`;
}
const leaf = (p) => String(p ?? '').split(/[\\/]/).filter(Boolean).pop() ?? '';
// What an approved job waits on, by the rules `next` applies (see "Board columns" in the contract).
const queueOrder = (a, b) => String(a.approvedAt ?? '').localeCompare(String(b.approvedAt ?? '')) || a.id.localeCompare(b.id);
function waitReason(j) {
  const building = state.board.jobs.find((x) => BUILDING.includes(x.stage));
  if (building) return `waiting: ${building.id} is building`;
  const c = state.canary;
  if (c?.status === 'running') return 'waiting: deploy canary';
  const held = (x) => c?.status === 'failed' && state.config.deploys && x.kind !== 'bootstrap';
  if (held(j)) return 'held: deploy canary failed';
  const ahead = state.board.jobs.filter((x) => x.stage === 'approved' && !held(x) && queueOrder(x, j) < 0).sort(queueOrder).pop();
  return ahead ? `after ${ahead.id}` : 'next';
}
function jobCard(j) {
  const isMoving = state.moving.has(j.id);
  const draggable = (j.stage === 'backlog' || j.stage === 'ready') && !isMoving;
  const moving = isMoving ? '<span class="sub" data-moving><span class="spinner"></span>Moving…</span>' : '';
  const reviews = j.reviews && ROLES.some((r) => j.reviews[r] && j.reviews[r] !== 'pending')
    ? ROLES.map((r) => `<span class="chip ${esc(j.reviews[r])}" data-review="${r}" title="${r}">${r}:${esc(j.reviews[r])}</span>`).join('') : '';
  const sub = BUILDING.includes(j.stage) || j.stage === 'blocked'
    ? `<span class="sub">${j.stage} r${j.round}${j.stage === 'deploy' && j.deploy ? ` · ${j.deploy.attempts}/5` : ''}</span>`
    : j.stage === 'approved' ? `<span class="sub" data-wait>${esc(waitReason(j))}</span>` : '';
  const flag = j.flag ? `<span class="flag" data-flag title="${esc(j.flag.detail)}">${esc(j.flag.reason)}</span>` : '';
  const cost = j.costUsd != null ? `<span data-cost>$${Number(j.costUsd).toFixed(2)}</span>` : '';
  const repo = j.target ? `<div class="repo" title="${esc(j.target)}">→ ${esc(leaf(j.target))}</div>` : '';
  const kind = j.kind === 'bootstrap' ? '<span class="chip kind" data-kind="bootstrap">bootstrap</span>' : '';
  // Stacked on an unmerged job (see "Stacked jobs" in the contract): built on its branch, merged after it.
  const baseJob = j.base ? state.board.jobs.find((x) => x.id === j.base) : null;
  const stacked = baseJob && baseJob.stage !== 'done'
    ? `<span class="chip kind" data-base title="built on ${esc(j.base)}'s unmerged branch; merges after it">on ${esc(j.base)}</span>` : '';
  // A sibling of the same idea merged since this was specced (see "Build checks" in the contract).
  const moved = j.baseMoved?.by
    ? `<span class="chip kind" data-base-moved title="${esc(j.baseMoved.by)} merged after this spec was written; check the spec still fits main">base moved: ${esc(j.baseMoved.by)} merged</span>` : '';
  // Toggleable before the job builds; afterwards shown only when it is not the default.
  const p = j.provider ?? 'subscription';
  const settable = j.stage === 'backlog' || j.stage === 'approved';
  const provider = settable || p !== 'subscription'

  const pr = j.pr?.url && (j.stage === 'ready' || j.stage === 'blocked') ? `<a class="chip pr" data-pr href="${esc(j.pr.url)}" target="_blank" rel="noopener" draggable="false">PR #${esc(j.pr.number)}</a>` : '';
  return `<div class="card${state.open?.id === j.id ? ' selected' : ''}" data-card="${esc(j.id)}" data-stage="${esc(j.stage)}" draggable="${draggable}">
    <div class="top"><span>${esc(j.id)}</span><span>r${j.round} · ${elapsed(j)}</span></div>
    <div class="title">${esc(j.title)}</div>${repo}
    <div class="meta">${moving}${kind}${stacked}${moved}${provider}${pr}${sub}${flag}${reviews}${cost}</div>${previewBar(j)}${blockedBar(j)}</div>`;
}
// A blocked card's ways out (see "Blocked" in the contract): Retry deploy, Rework (opens the note), Discard.
function blockedBar(j) {

async function redeploy(id) {

// The preview's state (up, or expired once its auto-destroy time has passed) and where to open it.
function preview(j) {
  const d = j.deploy;
  const url = d.urls?.frontend ?? (d.urls?.api ? `${d.urls.api}/openapi/v1.json` : null);
  // A failed destroy outranks the timer: what it left behind is still there, and still billing.
  if (d.destroyError && d.status !== 'destroying' && d.status !== 'down') return { status: 'failed', label: 'destroy failed', url, live: false };

// The job's ephemeral preview: its state, and Launch / QA login / Tear down while it is up.
function previewBar(j) {

    + (live ? '<button type="button" class="chip action" data-qa>QA login</button>' : '')

async function qaLogin(id) {

  toast(res.ok ? res.message.replace(/\n/g, ' · ') : res.message, !res.ok);
}
async function tearDown(id) {

// Abandon on an Ideas card: the first click asks, a second within 4 s abandons (see "Ideas").
function abandonBtn(key) {
  const armed = state.armed === key;
  return `<button type="button" class="chip action${armed ? ' danger' : ''}" data-abandon="${esc(key)}">${armed ? 'Abandon?' : 'Abandon'}</button>`;
}
async function abandon(key) {

  if (state.armed !== key) {

    renderBoard();

function ideaCard(i) {

    <div class="top"><span>${esc(i.id)}</span><span>${i.status === 'failed' ? 'failed' : i.status === 'waiting' ? `waiting for bootstrap ${esc(i.jobs?.[0] ?? '')}` : `spec it: <code>/factory:idea ${esc(i.id)}</code>`}</span></div>
    <div class="title">${esc(i.text)}</div>

    ${i.reason ? `<div class="meta">${esc(i.reason)}</div>` : ''}

function sessionCard(x) {

    : x.status === 'error' ? '<span class="flag">error</span>' : '<span class="chip">your turn</span>';
  return `<div class="card idea-card session-card" data-session="${esc(x.id)}">
    <div class="top"><span>${esc(x.id)}${x.idea ? ` · ${esc(x.idea)}` : ''}</span><span>${x.costUsd ? `$${Number(x.costUsd).toFixed(2)}` : ''}</span></div>
    <div class="title">${esc(x.text)}</div>

function renderBoard() {
  const before = new Map([...document.querySelectorAll('[data-card]')].map((el) => [el.dataset.card, el.getBoundingClientRect()]));
  $('#board').innerHTML = COLUMNS.map((c) => {
    const inSession = new Set(state.sessions.map((x) => x.idea).filter(Boolean));
    const items = c.key === 'ideas'
      ? [...state.sessions.map(sessionCard), ...state.board.ideas.filter((i) => i.status !== 'done' && i.status !== 'abandoned' && !inSession.has(i.id)).map(ideaCard)]
      : state.board.jobs.filter((j) => c.stages.includes(j.stage)).map(jobCard);
    const clear = c.key === 'done' ? '<button id="purge-btn" type="button" title="Remove evaluated done and discarded cards, their folders and branches; unevaluated ones stay">Clear</button>'
      : c.key === 'ideas' && state.config.enabled ? '<button id="new-idea-btn" class="primary" type="button" title="Grill an idea with Claude, here">New idea</button>' : '';
    return `<section class="column" data-column="${c.key}"><h2>${c.label}<span>${items.length}${clear}</span></h2><div class="cards">${items.join('')}</div></section>`;

    const now = el.getBoundingClientRect();

    if (dx || dy) el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: 450, easing: 'cubic-bezier(.2,.7,.2,1)' });

// --- drag and drop -------------------------------------------------------------------------
let dragging = null;
document.addEventListener('dragstart', (e) => {

  if (!el) return;
  dragging = { id: el.dataset.card, stage: el.dataset.stage };
  e.dataTransfer.setData('text/plain', dragging.id);
  e.dataTransfer.effectAllowed = 'move';
  for (const t of DROP_TARGETS[dragging.stage] ?? []) document.querySelector(`[data-column="${t}"]`)?.classList.add('drop-ok');
});
document.addEventListener('dragend', () => { dragging = null; document.querySelectorAll('.drop-ok').forEach((c) => c.classList.remove('drop-ok')); });
document.addEventListener('dragover', (e) => { if (dragging && e.target.closest?.('[data-column]')) e.preventDefault(); });
document.addEventListener('drop', async (e) => {
  const col = e.target.closest?.('[data-column]');
  if (!col || !dragging) return;
  e.preventDefault();
  const { id, stage } = dragging;
  const to = col.dataset.column;
  dragging = null;
  document.querySelectorAll('.drop-ok').forEach((c) => c.classList.remove('drop-ok'));
  if (COLUMNS.find((c) => c.key === to)?.stages?.includes(stage)) return;

    openModal('job', id);
    toast('Add a rework note, then press Rework');
    setTimeout(() => $('#rework-note')?.focus(), 50);
    return;
  }
  await move(id, to);
});

async function move(id, to, note) {
  if (to === 'approved') {
    if (state.moving.has(id)) return false;   // already on its way; a second request would be refused
    state.moving.add(id);
    renderBoard();
  }
  if (to === 'done') toast(`${id}: merging…`);
  let res;
  try { res = await api('POST', `/api/jobs/${id}/move`, note ? { to, note } : { to }); }
  catch (err) { res = { ok: false, message: `${id}: ${err.message}` }; }
  if (to === 'approved') state.moving.delete(id);
  if (res.ok) toast(`${id} → ${to === 'discarded' ? 'discarded' : COLUMNS.find((c) => c.key === to)?.label ?? to}`);
  else toast(res.message || 'refused', true);
  state.boardText = '';
  await poll();
  return res.ok;
}

async function setProvider(id, provider) {
  const res = await api('POST', `/api/jobs/${id}/provider`, { provider });
  toast(res.ok ? `${id} → ${provider}` : res.message || 'refused', !res.ok);
  state.boardText = '';

// --- modal ---------------------------------------------------------------------------------
document.addEventListener('click', (e) => {
  if (e.target.closest('#modal')) return;
  if (e.detail > 1) return;   // the rest of a double-click on Approve lands on whatever the closed modal uncovered
  if (e.target.id === 'backdrop') { closeModal(); return; }
  if (e.target.closest?.('a[data-pr]')) return;   // the card's PR link opens GitHub, not the modal
  if (e.target.closest?.('a[data-launch]')) return;   // Launch opens the preview, not the modal
  const qa = e.target.closest?.('[data-qa]');
  if (qa) { qaLogin(qa.closest('[data-card]').dataset.card); return; }
  const td = e.target.closest?.('[data-teardown]');
  if (td) { td.disabled = true; tearDown(td.closest('[data-card]').dataset.card); return; }
  const rd = e.target.closest?.('[data-redeploy]');
  if (rd) { rd.disabled = true; redeploy(rd.closest('[data-card]').dataset.card); return; }
  const rw = e.target.closest?.('[data-rework]');
  if (rw) { openRework(rw.closest('[data-card]').dataset.card); return; }
  const dc = e.target.closest?.('[data-discard]');
  if (dc) { move(dc.closest('[data-card]').dataset.card, 'discarded'); return; }
  const ab = e.target.closest?.('[data-abandon]');
  if (ab) { abandon(ab.dataset.abandon); return; }
  const pc = e.target.closest?.('[data-provider][data-toggle]');
  if (pc) { setProvider(pc.closest('[data-card]').dataset.card, pc.dataset.provider === 'openrouter' ? 'subscription' : 'openrouter'); return; }
  const c = e.target.closest?.('[data-card]');
  if (c) { openModal('job', c.dataset.card); return; }
  if (e.target.closest?.('#new-idea-btn')) { openModal('new-session', null); return; }
  const sc = e.target.closest?.('[data-session]');
  if (sc) { openModal('session', sc.dataset.session); return; }
  const i = e.target.closest?.('[data-idea]');
  if (i) openModal('idea', i.dataset.idea);
});
const openJob = () => state.open?.kind === 'job' ? state.board.jobs.find((x) => x.id === state.open.id) : null;
const openIdea = () => state.open?.kind === 'idea' ? state.board.ideas.find((x) => x.id === state.open.id) : null;

async function openModal(kind, id) {
  if (kind === 'session' || kind === 'new-session') {
    state.open = { kind, id }; state.tab = 'session';
    if (state.sess?.id !== id) state.sess = id ? { id, s: null, chat: [], streamText: '', texts: [], actKey: '' } : null;
    $('#backdrop').classList.add('open');
    renderHead(); renderTabs(); renderBody();

  }

  state.open = { kind, id };

  renderBoard();
  renderHead(); renderTabs(); renderBody();
  if (kind === 'idea') {
    const brief = await getText(`/state/ideas/${id}/brief.md`);
    if (state.open?.id === id) { state.specText = brief || '(no brief)'; if (state.tab === 'brief') renderBody(); }
  }
  if (kind === 'job') {
    const spec = await getText(`/state/jobs/${id}/spec.md`);
    if (state.open?.id === id && !state.specDirty) { state.specText = spec; if (state.tab === 'spec') renderBody(); }
    refreshFiles();
  }
}
function closeModal() {
  if (state.specDirty && !confirm('Discard unsaved spec edits?')) return;
  state.open = null; state.specDirty = false;
  $('#backdrop').classList.remove('open');
  renderBoard();
}
async function refreshFiles() {
  if (state.open?.kind !== 'job') return;
  const id = state.open.id;
  const r = await fetch(`/api/jobs/${id}/files`, { cache: 'no-store' });
  const files = r.ok ? await r.json() : [];
  if (state.open?.id !== id) return;
  if (JSON.stringify(files) !== JSON.stringify(state.files)) { state.files = files; if (state.tab === 'artifacts') renderBody(); if (state.tab === 'output') refreshOutput(); }
}

function renderHead() {

// --- live output: the orchestrator's stream-json plus each agent's transcript --------------------
function summarize(input) {
  if (!input || typeof input !== 'object') return '';
  const v = input.description ?? input.command ?? input.file_path ?? input.pattern ?? input.path ?? input.subagent_type ?? JSON.stringify(input);
  const s = String(v).replace(/\s+/g, ' ');
  return s.length > 160 ? s.slice(0, 160) + '…' : s;
}
function resultText(c) {
  const t = typeof c === 'string' ? c : Array.isArray(c) ? c.map((x) => x.text ?? '').join(' ') : '';
  const s = t.replace(/\s+/g, ' ').trim();
  return s.length > 200 ? s.slice(0, 200) + '…' : s;
}
// Turns one stream line into terminal lines. `who` is the default tag; `agents` maps Agent tool ids to names.
function streamLines(raw, who, agents) {
  let o; try { o = JSON.parse(raw); } catch { return raw.trim() ? [{ who, cls: 'dim', text: raw }] : []; }
  const tag = o.parent_tool_use_id ? (agents[o.parent_tool_use_id] ?? 'agent') : who;
  const out = [];
  if (o.type === 'system' && o.subtype === 'init') out.push({ who: tag, cls: 'dim', text: `● session started${o.model ? ` (${o.model})` : ''}` });
  if (o.type === 'result') out.push({ who: tag, cls: 'done', text: `■ ${o.subtype ?? 'done'} · $${Number(o.total_cost_usd ?? 0).toFixed(2)} · ${Math.round((o.duration_ms ?? 0) / 1000)}s` });
  const content = o.message?.content;
  if ((o.type === 'assistant' || o.type === 'user') && typeof content === 'string' && o.type === 'user') out.push({ who: tag, cls: 'dim', text: `› ${resultText(content)}` });
  if (Array.isArray(content)) for (const b of content) {
    if (b.type === 'thinking') out.push({ who: tag, cls: 'thinking', text: b.thinking ? `💭 ${b.thinking}` : '💭 thinking…' });
    else if (b.type === 'text' && o.type === 'assistant') out.push({ who: tag, cls: '', text: b.text });
    else if (b.type === 'text' && o.type === 'user') out.push({ who: tag, cls: 'dim', text: `› ${resultText(b.text)}` });
    else if (b.type === 'tool_use') {
      if (b.name === 'Agent' || b.name === 'Task') agents[b.id] = String(b.input?.subagent_type ?? 'agent').replace(/^factory:/, '');
      out.push({ who: tag, cls: 'tool', text: `▸ ${b.name}(${summarize(b.input)})` });
    } else if (b.type === 'tool_result') out.push({ who: tag, cls: 'res', text: `  ↳ ${resultText(b.content)}` });
  }
  return out;
}
let outputBusy = false;
async function refreshOutput() {
  const pane = $('[data-output]');
  if (!pane || outputBusy || !state.open) return;
  outputBusy = true;
  try {
    const { kind, id } = state.open;
    const sources = [];
    if (kind === 'job') for (const f of state.files.filter((f) => /^run-\d+\.jsonl$/.test(f)).sort((a, b) => parseInt(a.slice(4)) - parseInt(b.slice(4))))
      sources.push({ title: f.replace('.jsonl', ''), who: 'orchestrator', url: `/state/jobs/${id}/${f}` });
    for (const e of state.events.filter((e) => e.kind === 'agent-start' && e.agentId && (kind === 'job' ? e.job === id : e.idea === id && !e.job)))
      sources.push({ title: `${e.agent}${e.round ? ` · round ${e.round}` : ''}`, who: e.agent, url: `/api/agents/${encodeURIComponent(e.agentId)}/transcript` });
    const texts = await Promise.all(sources.map((s) => getText(s.url)));
    const key = texts.map((t) => t.length).join(',') + '|' + sources.map((s) => s.url).join(',');
    if (key === state.outputKey || state.open?.id !== id) return;
    state.outputKey = key;
    const agents = {};
    const html = sources.map((s, k) => {
      const lines = texts[k].split('\n').flatMap((l) => streamLines(l, s.who, agents));
      return `<div class="sep">── ${esc(s.title)} ──</div>` + lines.map((l) =>
        `<div class="ln ${l.cls}" data-agent="${esc(l.who)}"><span class="tag">[${esc(l.who)}]</span>${esc(l.text)}</div>`).join('');
    }).join('');
    const p = $('[data-output]');
    if (!p) return;
    const atBottom = p.scrollHeight - p.scrollTop - p.clientHeight < 40;
    p.innerHTML = html || '<div class="ln dim">No output yet.</div>';
    if (atBottom) p.scrollTop = p.scrollHeight;
  } finally { outputBusy = false; }
}

// --- idea sessions: the grill, the brief and the specs, with Claude through the API ----------------
// The panel only shows and asks. Every board change is a button that calls one session endpoint.
const UI_TOOLS = ['ask_questions', 'propose_scaffold', 'submit_brief'];
const money = (v) => `$${Number(v ?? 0).toFixed(Number(v ?? 0) < 1 ? 3 : 2)}`;

async function sessApi(action, body, method = 'POST', type = 'application/json') {
  const r = await api(method, `/api/sessions/${state.sess.id}/${action}`, body, type);
  if (!r.ok) toast(r.message || 'refused', true);
  state.sess.texts = []; state.sessionsText = null;
  await refreshSession();
  return r;
}

function renderNewSession(body) {
  const targets = [...new Set([...state.board.ideas.map((i) => i.target), ...state.board.jobs.map((j) => j.target)].filter(Boolean))];
  const options = (repos) => `<option value="+new">+ Add new (Claude grills you and names the repo)</option>
    ${[...new Set([...repos, ...targets])].map((t) => `<option value="${esc(t)}">${esc(t)}</option>`).join('')}

  body.innerHTML = `<div class="s-form">
    <label for="s-target">Target repo</label>

      <input id="s-other" autocomplete="off" hidden placeholder="${esc(state.config.owner || 'owner')}/todo-app"></div>
    <label for="s-base" id="s-base-label" hidden>Base</label>
    <div id="s-base-row" hidden><select id="s-base"></select> <span style="color:var(--muted);font-size:12px">An unmerged job: the session reads its branch, and the specs build on it.</span></div>
    <label for="s-text">The idea</label>
    <textarea id="s-text" rows="5" placeholder="What do you want built? A sentence is enough: Claude asks the rest."></textarea>
    <span></span><div class="actions"><button class="primary" id="s-start">Start</button>
      <span style="color:var(--muted);font-size:12px">An existing repo, or a new one that a bootstrap job creates and scaffolds.</span></div></div>`;
  // Base: main, or an unmerged job on the target that has a PR (see "Stacked jobs" in the contract).
  const target = () => $('#s-target').value === '+other' ? $('#s-other').value.trim() : $('#s-target').value;
  const fillBase = () => {
    const t = target();
    const jobs = state.board.jobs.filter((j) => j.target === t && !['done', 'discarded'].includes(j.stage) && j.pr);
    $('#s-base').innerHTML = '<option value="">main</option>'
      + jobs.map((j) => `<option value="${esc(j.id)}">${esc(j.id)}: ${esc(j.title)} (unmerged, ${esc(j.stage)})</option>`).join('');
    $('#s-base-label').hidden = $('#s-base-row').hidden = !jobs.length;

  $('#s-other').oninput = fillBase;

    const v = $('#s-target').value, text = $('#s-text').value.trim(), base = $('#s-base').value || undefined;
    const r = await api('POST', '/api/sessions', v === '+new' ? { new: true, text } : { target: target(), text, base });
    if (!r.ok) { toast(r.message || 'refused', true); b.disabled = false; return; }
    state.sessionsText = null; poll();
    openModal('session', r.message);
  };
}

function renderSessionHead(h, close) {
  const s = state.sess?.s;
  const canClose = s && s.status !== 'running' && s.status !== 'closed';
  h.innerHTML = `${close}<h3>${esc(s?.text ?? state.sess?.id)}</h3>
    <div class="sub-meta">${esc(state.sess?.id)}${s?.idea ? ` · ${esc(s.idea)}` : ''} · ${esc(s?.status ?? '…')}${s?.target ? ` · target <code>${esc(s.target)}</code>${s.newTarget ? ' (new)' : ''}` : s ? ' · target pending' : ''}${s?.base ? ` · base <code>factory/${esc(s.base)}</code>` : ''}${s?.model ? ` · <code>${esc(s.model)}</code>` : ''} · <span data-cost>${money(s?.costUsd)}</span>
    ${canClose ? ' · <button type="button" id="s-close" class="danger" style="padding:1px 8px;font-size:12px">Close session</button>' : ''}</div>`;
  $('#s-close', h)?.addEventListener('click', async () => {
    const r = await sessApi('close', { failed: true, reason: 'closed in session before every spec was decided' });
    if (r.ok) { toast(`${state.sess.id} closed`); closeModal(); state.sessionsText = null; poll(); }
  });
}

let sessBusy = false;
async function refreshSession() {
  const sx = state.sess;
  if (!sx || sessBusy || state.open?.kind !== 'session') return;
  sessBusy = true;
  try {
    const base = `/state/sessions/${sx.id}/`;
    const texts = await Promise.all(['session.json', 'chat.json', 'stream.jsonl'].map((f) => getText(base + f)));
    if (state.sess !== sx || state.open?.kind !== 'session') return;
    if (!texts.every((t, k) => t === sx.texts[k])) {
      try { sx.s = JSON.parse(texts[0]); } catch { return; }
      try { sx.chat = JSON.parse(texts[1]).messages ?? []; } catch { sx.chat = []; }
      sx.stream = texts[2].split('\n').filter(Boolean).map((l) => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean);
      sx.texts = texts;
      renderHead();
      renderSessionLog();
    }
    if (!sx.s) return;
    // The actions change with the session, and with the board (the bootstrap job and the idea).
    const s = sx.s;
    const boot = s.bootstrap ? state.board.jobs.find((j) => j.id === s.bootstrap)?.stage : null;
    const idea = s.idea ? state.board.ideas.find((i) => i.id === s.idea)?.status : null;
    const key = JSON.stringify([s.status, s.error, s.pending?.id, s.idea, (s.specs ?? []).map((x) => [x.k, x.title, x.decision]), boot, idea]);
    if (key !== sx.actKey) { sx.actKey = key; renderSessionActions(); }
  } finally { sessBusy = false; }
}

function toolLine(b) {
  const i = b.input ?? {};
  const text = b.name === 'ask_questions' ? `? ${(i.questions ?? []).map((q) => q.question).join(' · ')}`
    : b.name === 'submit_brief' ? '▸ proposed the brief'
    : b.name === 'propose_scaffold' ? `▸ proposed the scaffold: ${[i.name, i.resource, i.db, i.ui, i.events ? 'events' : 'no events', i.auth ? 'sign-in' : 'no sign-in'].join(' / ')}`
    : b.name === 'submit_specs' ? `▸ wrote ${(i.specs ?? []).length} spec(s)`
    : b.name === 'revise_spec' ? `▸ revised spec ${i.k}`
    : `▸ ${b.name}(${i.path ?? i.pattern ?? ''})`;
  return `<div class="tool-ln">${esc(text)}</div>`;
}

function renderSessionLog() {
  const sx = state.sess, el = $('[data-log]');
  if (!el || !sx?.s) return;
  const names = {};
  for (const m of sx.chat) if (m.role === 'assistant') for (const b of m.content ?? []) if (b.type === 'tool_use') names[b.id] = b.name;
  const out = [];
  sx.chat.forEach((m, mi) => {
    const blocks = typeof m.content === 'string' ? [{ type: 'text', text: m.content }] : m.content ?? [];
    for (const b of blocks) {
      if (m.role === 'user') {
        if (b.type === 'text') out.push(`<div class="msg you">${esc(mi === 0 ? sx.s.text : b.text)}</div>`);
        else if (b.type === 'tool_result' && names[b.tool_use_id] === 'submit_brief' && /^The human confirmed/.test(b.content)) out.push(`<div class="tool-ln">✓ brief confirmed${sx.s.idea ? ` as ${esc(sx.s.idea)}` : ''}</div>`);
        else if (b.type === 'tool_result' && UI_TOOLS.includes(names[b.tool_use_id])) out.push(`<div class="msg you">${esc(b.content)}</div>`);
        else if (b.type === 'tool_result' && b.is_error) out.push(`<div class="tool-ln">  ↳ ${esc(resultText(b.content))}</div>`);
      } else if (b.type === 'text' && b.text) out.push(`<div class="msg claude md">${md(b.text)}</div>`);
      else if (b.type === 'tool_use') out.push(toolLine(b));
    }
  });
  if (sx.s.status === 'running') {
    // This turn so far, from stream.jsonl; chat.json gets it when the turn ends.
    let text = '';
    const flush = (live) => { if (text || live) out.push(`<div class="msg claude md${live ? ' live' : ''}">${md(text)}</div>`); text = ''; };
    for (const e of sx.stream ?? []) {
      if (e.type === 'text') text += e.text;
      else if (e.type === 'tool') { flush(false); out.push(`<div class="tool-ln">${esc(`▸ ${e.name}(${e.summary ?? ''})`)}</div>`); }
    }
    flush(true);
  }
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 60;
  el.innerHTML = out.join('');
  if (atBottom) el.scrollTop = el.scrollHeight;
}

async function decide(sp, decision) {
  const r = await sessApi(`specs/${sp.k}`, { decision });
  if (r.ok) toast(decision === 'rejected' ? `Spec ${sp.k} rejected` : `${r.message} → ${decision === 'approved' ? 'Approved' : 'Backlog'}`);
  const s = state.sess.s;
  if (!(s.specs ?? []).every((x) => x.decision)) return;
  const kept = s.specs.filter((x) => x.decision !== 'rejected');
  const c = await sessApi('close', { failed: !kept.length });
  if (!c.ok) return;
  toast(kept.length ? `${s.idea} done: ${kept.map((x) => `${x.job} ${x.decision === 'approved' ? 'approved' : 'in Backlog'}`).join(', ')}` : `${s.idea} closed: every spec rejected`);
  state.sessionsText = null; state.boardText = '';
  closeModal(); poll();
}

function renderSessionActions() {

  if (!p) html += `<div class="actions" style="align-items:flex-end"><textarea id="s-msg" rows="2" style="flex:1;font-family:inherit" placeholder="${(s.specs ?? []).length ? 'Ask Claude to change a spec (say which)' : 'Message Claude'}"></textarea><button id="s-send">Send</button></div>`;

    if ($('#sc-repo')) scaffold.repo = $('#sc-repo').value.trim();
    sessApi('reply', { text: `Scaffold confirmed: ${scaffold.repo ? `repo ${scaffold.repo}, ` : ''}name ${scaffold.name}, resource ${scaffold.resource}, data store ${scaffold.db}, front end ${scaffold.ui}, ${scaffold.events ? 'with' : 'no'} events.`, scaffold });
  });
  $('#s-confirm-brief', el)?.addEventListener('click', async (e) => {
    e.currentTarget.disabled = true;
    const r = await sessApi('brief');
    if (r.ok) toast(`Brief saved as ${r.message.split(' ')[0]}`);
  });
  $('#s-correct', el)?.addEventListener('click', () => { const t = $('#s-correction').value.trim(); if (t) sessApi('reply', { text: t }); else toast('Say what to correct', true); });
  $('#s-approve-boot', el)?.addEventListener('click', () => move(s.bootstrap, 'approved'));
  $('#s-write-specs', el)?.addEventListener('click', () => sessApi('write-specs'));
  if (s.bootstrap && $('[data-boot-spec]', el)) getText(`/state/jobs/${s.bootstrap}/spec.md`).then((t) => { const d = $('[data-boot-spec]', el); if (d) d.innerHTML = md(t); });

  for (const sp of s.specs ?? []) {
    const card = el.querySelector(`[data-spec="${sp.k}"]`);
    if (!card) continue;
    const url = `/state/ideas/${s.idea}/spec-${sp.k}.md`;
    getText(url).then((t) => { const d = $('[data-spec-md]', card); if (d && !$('textarea', card)) d.innerHTML = md(t); });
    for (const b of card.querySelectorAll('[data-decide]')) b.onclick = () => { card.querySelectorAll('button').forEach((x) => { x.disabled = true; }); decide(sp, b.dataset.decide); };

      };
    });
  }
}

// fb is the open evaluation's human feedback: the saved file parsed, then the human's unsaved draft.
const evalView = { list: [], text: '', pend: '', open: null, body: '', fb: { rating: '', note: '' } };
function duration(ms) {
  if (!ms) return '';
  const s = Math.round(ms / 1000);
  return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`;
}
// Finished jobs on the board with no evaluation yet: purge keeps them until they have one.
function pendingEvals() {
  const done = new Set(evalView.list.map((e) => e.job));
  return state.board.jobs.filter((j) => (j.stage === 'done' || j.stage === 'discarded') && !done.has(j.id))
    .map((j) => ({ job: j.id, idea: j.idea, title: j.title, target: j.target, rating: 'not evaluated', pending: true,
      stage: j.stage, round: j.round, flag: j.flag?.reason, merged: j.merged?.sha, costUsd: j.costUsd, durationMs: j.durationMs }));
}
function evalRows() {
  return [...evalView.list, ...pendingEvals()].sort((a, b) => Number(b.job.replace(/\D/g, '')) - Number(a.job.replace(/\D/g, '')));
}
function evalRow(x) {
  const facts = [
    x.stage, `r${x.round}`, x.flag ? `<span class="flag">${esc(x.flag)}</span>` : '',
    x.gate ? `gate ${esc(x.gate)}` : '', x.merged ? `merged ${esc(String(x.merged).slice(0, 7))}` : '',
    x.costUsd != null ? `$${Number(x.costUsd).toFixed(2)}` : '', duration(x.durationMs),
  ].filter(Boolean).map((f) => f.startsWith('<') ? f : `<span>${esc(f)}</span>`).join(' · ');
  return `<div class="card eval-row${evalView.open === x.job ? ' selected' : ''}" data-eval="${esc(x.job)}"${x.pending ? ' data-pending' : ''}>
    <div class="top"><span>${esc(x.job)}${x.idea ? ` · ${esc(x.idea)}` : ''}</span><span>${esc(String(x.evaluatedAt ?? '').slice(0, 10))}</span></div>
    <div class="title">${esc(x.title)}</div>
    ${x.target ? `<div class="repo" title="${esc(x.target)}">→ ${esc(leaf(x.target))}</div>` : ''}
    <div class="meta"><span class="chip rating-${esc(x.rating)}" data-rating>${esc(x.rating)}</span>${x.human ? `<span class="chip rating-${esc(x.human.rating)}" data-human-rating>you: ${esc(x.human.rating)}</span>` : ''}${facts}</div></div>`;
}
// Gate, cost and time: the snapshot's facts as a grid, above the evaluation's markdown.
function evalFacts(x) {
  const usd = (n) => n != null ? `$${Number(n).toFixed(2)}` : '—';
  const fact = (key, label, value, sub = '', cls = '') =>
    `<div class="fact" data-fact="${key}"><div class="k">${label}</div><div class="v ${cls}">${esc(value)}</div>${sub ? `<div class="s">${esc(sub)}</div>` : ''}</div>`;
  const agents = x.agents ?? [];
  const totalAgentMs = agents.reduce((s, a) => s + (a.ms ?? 0), 0);
  const maxAgentMs = Math.max(1, ...agents.map((a) => a.ms ?? 0));
  const models = Object.entries(x.models ?? {});
  const maxModelUsd = Math.max(0.0001, ...models.map(([, m]) => m.costUsd ?? 0));
  const bar = (v, max) => `<span class="bar" style="width:${Math.max(2, Math.round(100 * v / max))}%"></span>`;
  return `<section class="facts" data-eval-facts>
    <h2>Gate, cost and time</h2>
    <div class="fact-grid">
      ${fact('gate', 'Gate', x.gate ?? 'not run', x.decision ? `approver ${x.decision}` : '', x.gate ?? '')}
      ${fact('cost', 'Cost', usd(x.costUsd), models.length ? `${models.length} model${models.length > 1 ? 's' : ''}` : '')}
      ${fact('time', 'Time', duration(x.durationMs) || '—', 'runner wall time')}
      ${fact('rounds', 'Rounds', String(x.round ?? '—'), x.flag ? `flag ${x.flag}` : 'no flag')}
      ${fact('agent-time', 'Agent time', duration(totalAgentMs) || '—', `summed over ${agents.length} agent runs; reviewers overlap`)}
      ${fact('gate-time', 'Gate time', duration(x.gateMs) || '—')}
      ${fact('outcome', 'Outcome', x.stage ?? '—', x.merged ? `merged ${String(x.merged).slice(0, 7)}` : '')}
    </div>
    ${models.length || agents.length ? `<div class="breakdown">
      <div><h3>Cost by model</h3>${models.map(([m, u]) => `<div class="bd-row" data-model="${esc(m)}"><span class="name">${esc(m)}</span><span class="num">${usd(u.costUsd)} · ${Number(u.outputTokens ?? 0).toLocaleString()} out</span>${bar(u.costUsd ?? 0, maxModelUsd)}</div>`).join('') || '<div class="s">no run logs</div>'}</div>
      <div><h3>Time by agent</h3>${agents.map((a) => `<div class="bd-row" data-agent="${esc(a.agent)}"><span class="name">${esc(a.agent)} r${esc(a.round)}</span><span class="num">${duration(a.ms) || '0s'}</span>${bar(a.ms ?? 0, maxAgentMs)}</div>`).join('') || '<div class="s">no agent events</div>'}</div>
    </div>` : ''}
  </section>`;
}
function feedbackForm() {

async function saveFeedback() {

function renderEvals() {

    : '<div class="eval-empty">No evaluations yet. A finished job is evaluated with <code>factory.ps1 eval &lt;id&gt; -File &lt;md&gt;</code>.</div>';
  for (const el of list.querySelectorAll('[data-eval]')) el.onclick = () => openEval(el.dataset.eval);

    : evalView.open ? (x ? evalFacts(x) : '') + md(evalView.body) + (x ? feedbackForm() : '') : '<p class="eval-empty">Pick an evaluation.</p>';
  const note = $('[data-feedback] textarea', body);

  for (const b of body.querySelectorAll('[data-human]')) b.onclick = () => { evalView.fb.rating = b.dataset.human; renderEvals(); };

async function refreshEvals() {
  const t = await getText('/api/evals');
  const pend = pendingEvals().map((e) => e.job).join();
  if (t === evalView.text && pend === evalView.pend) return;
  evalView.text = t; evalView.pend = pend;
  try { evalView.list = t ? JSON.parse(t) : []; } catch { evalView.list = []; }
  if (evalView.open && evalView.list.some((e) => e.job === evalView.open)) evalView.body = await getText(`/state/evals/${encodeURIComponent(evalView.open)}.md`);
  renderEvals();

async function openEval(id) {

  evalView.body = await getText(`/state/evals/${encodeURIComponent(id)}.md`);

}

}
async function refreshLessons() {
  const t = await getText('/api/lessons');
  if (t === lessonView.text) return;
  lessonView.text = t;
  try { lessonView.list = t ? JSON.parse(t) : []; } catch { lessonView.list = []; }
  renderLessons();
}
async function openLesson(id) {
  lessonView.open = id;
  lessonView.body = await getText(`/state/lessons/${encodeURIComponent(id)}.md`);
  renderLessons();
}
async function markLesson(id, status, session) {
  const res = await api('POST', `/api/lessons/${encodeURIComponent(id)}/mark`, session ? { status, session } : { status });
  if (!res.ok) toast(res.message, true);
  lessonView.text = '';
  await refreshLessons();
}
// The selected lessons become one idea session on the templates repo, so the fix goes through the
// factory under the human's approval like any other change.
async function proposeFix() {
  const repo = state.config.templatesRepo;
  if (!repo) { toast('Set FACTORY_TEMPLATES_REPO in .env to the template-projects repo', true); return; }
  const ids = [...lessonView.picked];
  const bodies = await Promise.all(ids.map((id) => getText(`/state/lessons/${encodeURIComponent(id)}.md`)));
  const text = `Template fixes from factory lessons (${ids.join(', ')}). Each says what went wrong in a job and where the fix belongs; make the templates handle it so the next scaffold needs no hand fix.\n\n${bodies.join('\n\n---\n\n')}`;
  if (!state.config.enabled) { toast(`No Anthropic key: run pwsh factory/scripts/idea.ps1 ${repo} and paste the lessons`, true); return; }
  const res = await api('POST', '/api/sessions', { target: repo, text });
  if (!res.ok) { toast(res.message, true); return; }
  for (const id of ids) await markLesson(id, 'proposed', res.message);
  lessonView.picked.clear();
  renderLessons();
  toast(`Proposed as ${res.message} on ${repo}`);
}

function showView(v) {
  state.view = v;
  for (const b of document.querySelectorAll('#views [data-view]')) b.classList.toggle('on', b.dataset.view === v);
  $('#pipeline').hidden = $('#board').hidden = v !== 'board';
  $('#evals').hidden = v !== 'evals';
  $('#lessons').hidden = v !== 'lessons';
  if (v === 'evals') refreshEvals();
  if (v === 'lessons') { lessonView.text = ''; refreshLessons(); }
}
for (const b of document.querySelectorAll('#views [data-view]')) b.onclick = () => showView(b.dataset.view);
setInterval(() => { if (state.view === 'evals') refreshEvals(); if (state.view === 'lessons') refreshLessons(); }, 3000);

document.addEventListener('click', async (e) => {
  if (!e.target.closest?.('#purge-btn')) return;
  const res = await api('POST', '/api/purge');
  state.boardText = '';
  await poll();
  const kept = state.board.jobs.filter((j) => j.stage === 'done' || j.stage === 'discarded').map((j) => j.id);
  const keptMsg = kept.length ? `${kept.join(', ')} kept until evaluated` : '';
  const cleared = res.message ? `Cleared ${res.message.split('\n').join(', ')}` : kept.length ? '' : 'Nothing to clear';
  toast(res.ok ? [cleared, keptMsg].filter(Boolean).join(' · ') : res.message, !res.ok);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state.open) closeModal(); });

render();
getText('/api/ideate/config').then((t) => { try { state.config = JSON.parse(t); } catch {} state.sessionsText = null; poll(); });
setInterval(poll, 1500);
setInterval(() => { if (!dragging) renderBoard(); }, 15000);
</script>
</body>
</html>

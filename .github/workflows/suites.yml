# What every PR runs: the Playwright smoke set (@smoke, about 5 tests). The full Playwright suite and
# the full Pester suite run on demand (full.yml); Pester also runs when a PR touches the scripts
# (pester.yml). Tiers and when each runs: docs/TESTING.md. The .NET tests run here on Linux.
name: suites

# Docs-only changes skip the suites: no test reads docs/ or the root markdown. The plugin's
# markdown (factory/plugin/**) is outside these paths on purpose, since the tests read it. A PR is
# judged on its whole diff, so one code file in it runs everything.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'

permissions:
  contents: read

jobs:
  playwright-smoke:
    uses: ./.github/workflows/_playwright.yml
    with:
      grep: '@smoke'

  # The .NET port (roadmap spec 01): unit and integration tests, tier counts and the coverage gates,
  # on one Linux VM. Windows and macOS run in full.yml, on demand.
  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Git identity for the test repos
        run: |
          git config --global user.email ci@factory.test
          git config --global user.name factory-ci
      - name: Unit and integration tests, coverage gates
        shell: pwsh
        run: ./src/factory/test.ps1

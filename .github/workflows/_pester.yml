# The full Pester suite, four shards on four Windows VMs (a private repo's runner has 2 cores, so
# parallelism comes from machines). Called by pester.yml (PRs that touch the scripts) and full.yml
# (on demand). See docs/TESTING.md for when each tier runs.
name: pester (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pester:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Git identity for the test repos
        run: |
          git config --global user.email ci@factory.test
          git config --global user.name factory-ci
          git config --global init.defaultBranch main
      - name: Pester 6
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 6.0.0 -Force -Scope CurrentUser -SkipPublisherCheck
      # Every test block in its own process, plus factory.Tests.ps1 on the azure backend (blob stub).
      - name: Pester shard ${{ matrix.shard }} of 4, local and azure
        shell: pwsh
        run: pwsh -NoProfile -File factory/tests/run-all.ps1 -Shard ${{ matrix.shard }}/4 -ResultDir pester-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pester-results-${{ matrix.shard }}
          path: pester-results

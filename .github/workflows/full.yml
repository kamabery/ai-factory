# On demand: the whole Playwright suite and/or the whole Pester suite. Start it from the Actions tab
# (or `gh workflow run full.yml -f suites=all`), or label a PR `e2e` (Playwright) or `full`
# (Pester); a labelled PR reruns it on each push. docs/TESTING.md.
name: full

on:
  workflow_dispatch:
    inputs:
      suites:
        description: Which suites
        type: choice
        options: [all, playwright, pester, dotnet]
        default: all
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  playwright:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.suites != 'pester' && inputs.suites != 'dotnet') ||
      (github.event.action == 'labeled' && github.event.label.name == 'e2e') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'e2e'))
    uses: ./.github/workflows/_playwright.yml

  pester:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.suites != 'playwright' && inputs.suites != 'dotnet') ||
      (github.event.action == 'labeled' && github.event.label.name == 'full') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'full'))
    uses: ./.github/workflows/_pester.yml

  # The .NET unit tests on Windows and macOS, and the integration tests too (every PR runs both on
  # Linux, in suites.yml). macOS minutes cost ten times Linux ones: run this before cutover, not per PR.
  dotnet:
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.suites == 'all' || inputs.suites == 'dotnet')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'full') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'full'))
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Git identity for the test repos
        run: |
          git config --global user.email ci@factory.test
          git config --global user.name factory-ci
      - name: Unit and integration tests
        shell: pwsh
        run: ./src/factory/test.ps1 -Tier all
